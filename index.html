<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Wise Rank Cards</title>
    <style>
        @page { 
            size: A4 portrait; 
            margin: 15mm; 
        }
        body {
            font-family: 'Times New Roman', serif;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 0;
        }
        .print-bar {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #bbb;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .print-bar button {
            padding: 8px 22px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            background: #fff;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .print-bar button:hover { 
            background: #ddd; 
        }
        @media print {
            .print-bar { display: none !important; }
        }
        .a4-sheet {
            width: 170mm;
            min-height: 257mm;
            margin: 15px auto;
            padding: 10mm;
            box-sizing: border-box;
            page-break-after: always;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .header-logo, .header-qr {
            width: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo img, .header-qr img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }
        .header-text {
            flex: 1;
            text-align: center;
        }
        .header-text h1 { 
            margin: 0; 
            font-size: 25px; 
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase; 
        }
        .header-text h3 { 
            margin: 3px 0; 
            font-size: 15px; 
        }
        .header-text p  { 
            margin: 2px 0; 
            font-size: 12px; 
            font-weight: bold;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            margin: 10px 0 5px 0;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th {
            border: 1px solid #000;
            background: #f2f2f2;
            padding: 6px;
            font-size: 12px;
            text-transform: uppercase;
            text-align: center;
        }
        td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }

        /* Footer & Signature Styles */
        .footer {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .sig-box {
            width: 30%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }
        .sig-img {
            height: 35px;
            max-width: 110px;
            object-fit: contain;
            margin-bottom: 3px;
        }
        .sig-title {
            font-size: 10px;
            font-weight: bold;
            border-top: 1px solid #000;
            padding-top: 4px;
            margin-top: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="print-bar">
        <button onclick="window.print()">🖨️ Print / Download PDF</button>
    </div>

    <div id="cards-container" style="text-align: center; padding: 30px; font-weight: bold; font-family: Arial, sans-serif;">
        Loading data, please wait...
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC_gxSEBJCZJuQYssPu-5yKDhLoxU3NlT2IUgx3FiHnILhgfISt8jQYiGJMvpwRngUIQ/exec";

        window.onload = function() {
            loadRankData();
        };

        function loadRankData() {
            fetch(SCRIPT_URL)
                .then(response => response.text())
                .then(text => {
                    try {
                        const sheetData = JSON.parse(text);
                        if (sheetData.error) {
                            document.getElementById('cards-container').innerText = "Script Error: " + sheetData.error;
                            return;
                        }
                        if (!sheetData || sheetData.length === 0) {
                            document.getElementById('cards-container').innerText = "No data found in RANK_JAGAT sheet!";
                            return;
                        }
                        processData(sheetData);
                    } catch(e) {
                        console.error("Response was not JSON:", text);
                        document.getElementById('cards-container').innerText = "Data format error! Please deploy a New Version in Apps Script.";
                    }
                })
                .catch(err => {
                    console.error("Error loading data:", err);
                    document.getElementById('cards-container').innerText = "Network connection or URL error.";
                });
        }

        function getOrdinalRank(n) {
            var s = ["th", "st", "nd", "rd"];
            var v = n % 100;
            var suf = s[(v - 20) % 10] || s[v] || s[0];
            return n + "<sup>" + suf + "</sup>";
        }

        function getTeacherSigFileName(cls) {
            if (!cls) return 'Images/ia.png';
            var clean = cls.toString().toLowerCase().replace(/class/g, '').replace(/[^a-z0-9]/g, '');
            
            if (clean.includes('ix') || clean.includes('nine') || clean.includes('x') || clean.includes('ten')) {
                return 'Images/jagatinfras.png';
            }
            return 'Images/' + clean + '.png';
        }

        function processData(sheetData) {
            var container = document.getElementById('cards-container');
            container.innerHTML = "";

            for (var startCol = 0; startCol < sheetData[0].length; startCol += 11) {
                if (!sheetData[0][startCol]) break;
                var cls = (sheetData[1] && sheetData[1][startCol + 1])
                          ? sheetData[1][startCol + 1] : "";
                var students = [];
                for (var r = 1; r < sheetData.length; r++) {
                    if (!sheetData[r][startCol + 4]) continue;
                    students.push({
                        merit : sheetData[r][startCol + 9],
                        rnk   : getOrdinalRank(sheetData[r][startCol + 2]),
                        name  : sheetData[r][startCol + 4],
                        roll  : sheetData[r][startCol + 5],
                        fm    : sheetData[r][startCol + 6],
                        gtt   : sheetData[r][startCol + 7],
                        pc    : parseFloat(sheetData[r][startCol + 8] || 0).toFixed(2)
                    });
                }
                if (students.length > 0) {
                    container.innerHTML += buildCard(cls, students);
                }
            }
        }

        function buildCard(cls, students) {
            var rankCounts = {};
            for (var k = 0; k < students.length; k++) {
                var r = students[k].rnk;
                rankCounts[r] = (rankCounts[r] || 0) + 1;
            }

            var renderedRanks = {};
            var rows = "";

            for (var i = 0; i < students.length; i++) {
                var st = students[i];
                rows += "<tr>"
                      + "<td>" + st.merit + "</td>";

                if (!renderedRanks[st.rnk]) {
                    var count = rankCounts[st.rnk];
                    rows += "<td rowspan='" + count + "' style='vertical-align: middle; font-weight: bold;'>" + st.rnk + "</td>";
                    renderedRanks[st.rnk] = true;
                }

                rows += "<td style='text-align:left;padding-left:6px'>" + st.name + "</td>"
                      + "<td>" + st.roll + "</td>"
                      + "<td>" + st.fm + "</td>"
                      + "<td>" + st.gtt + "</td>"
                      + "<td>" + st.pc + "%</td>"
                      + "</tr>";
            }

            var teacherSigPath = getTeacherSigFileName(cls);

            return ""
                + "<div class='a4-sheet'>"

                + "  <div class='header'>"
                + "    <div class='header-logo'>"
                + "      <img src='Images/Logo_Jagat.png' alt='Logo' onerror=\"this.style.display='none'\">"
                + "    </div>"
                + "    <div class='header-text'>"
                + "      <h1>SHRIPUR KINDERGARTEN SCHOOL</h1>"
                + "      <h3>2<sup>nd</sup> Summative Evaluation - 2026</h3>"
                + "      <p>Jagat Infrastructure &amp; Algorithm</p>"
                + "    </div>"
                + "    <div class='header-qr'>"
                + "      <img src='Images/qr.png' alt='QR' onerror=\"this.style.display='none'\">"
                + "    </div>"
                + "  </div>"

                + "  <div class='meta-info'>"
                + "    <span>Class/Sec: " + cls + "</span>"
                + "    <span>RANK CARD</span>"
                + "    <span>Merit List</span>"
                + "  </div>"

                + "  <table>"
                + "    <thead><tr>"
                + "      <th>SL</th><th>Rank</th><th>Student's Name</th>"
                + "      <th>Roll</th><th>FM</th><th>Obt.Marks</th><th>%</th>"
                + "    </tr></thead>"
                + "    <tbody>" + rows + "</tbody>"
                + "  </table>"

                + "  <div class='footer'>"
                + "    <div class='sig-box'>"
                + "      <img src='" + teacherSigPath + "' class='sig-img' alt='Class Teacher Sign' onerror=\"this.style.display='none'\">"
                + "      <div class='sig-title'>Class Teacher</div>"
                + "    </div>"
                + "    <div class='sig-box'>"
                + "      <img src='Images/jagatinfras.png' class='sig-img' alt='Jagat Infra Sign' onerror=\"this.style.display='none'\">"
                + "      <div class='sig-title'>Jagat Infrastructure &amp; Algorithm</div>"
                + "    </div>"
                + "    <div class='sig-box'>"
                + "      <img src='Images/principal.png' class='sig-img' alt='Principal Sign' onerror=\"this.style.display='none'\">"
                + "      <div class='sig-title'>Principal</div>"
                + "    </div>"
                + "  </div>"

                + "</div>";
        }
    </script>
</body>
</html>
