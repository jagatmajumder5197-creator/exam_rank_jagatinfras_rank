<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Card & Merit List - Shripur Kindergarten School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Control Bar (Hidden during Print) -->
    <div class="no-print-bar">
        <div style="font-weight: bold; font-size: 16px;">
            🎓 Rank Card System (GitHub Pages Mode)
        </div>
        <div class="controls">
            <label for="classSelect">Class Filter:</label>
            <select id="classSelect" onchange="filterClass()">
                <option value="ALL">All Classes</option>
            </select>

            <button class="btn-toggle" onclick="toggleView()" id="viewToggleBtn">Switch to Merit List</button>
            <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
        </div>
    </div>

    <div class="container" id="cards-container">
        <!-- Content dynamically injected here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
